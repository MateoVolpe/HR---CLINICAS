<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital de Clínicas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#eef7fc;
            font-family:Arial, Helvetica, sans-serif;
        }

        .encabezado{
            background:#5dade2;
            color:white;
            padding:35px 0;
            margin-bottom:60px;
        }

        .card{
            border:none;
            border-radius:12px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .card h3{
            color:#3498db;
            font-weight:600;
        }
        .btn-primary{
            background:#5dade2;
            border:none;
        }

        .btn-primary:hover{
            background:#3498db;
        }

        a{
            color:#3498db;
            text-decoration:none;
        }

        a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<header class="encabezado">

    <div class="container text-center">

        <div class="mb-3">
            <img src="../img/Logo_Hc.jpg" alt="Logo Hospital de Clínicas" class="img-fluid" style="max-width:120px;">
        </div>

        <h2>Hospital de Clínicas</h2>

        <p class="mb-0">
            Sistema de Gestión de Documentación
        </p>

    </div>

</header>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card p-4">

                <h3 class="text-center mb-4">
                    Inicio de Sesión
                </h3>

                <form action="../php/validar_login.php" method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="usuario"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            required>

                    </div>

                    <button class="btn btn-primary w-100">
                        Ingresar
                    </button>

                </form>

                <div class="text-center mt-4">

                    <a href="../index.html">
                        ← Volver al inicio
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
