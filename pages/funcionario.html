
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar funcionario | Hospital de Clínicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5" style="max-width: 680px;">
        <div class="card p-4 p-md-5">
            <h1 class="h2 mb-2" style="color:#2878a8;">Registrar funcionario</h1>
            <p class="text-muted mb-4">Ingrese los datos del nuevo funcionario.</p>

            <form id="formFuncionario">
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" type="text" id="nombre" name="nombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="apellido">Apellido</label>
                    <input class="form-control" type="text" id="apellido" name="apellido" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="usuario">Usuario</label>
                    <input class="form-control" type="text" id="usuario" name="usuario" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="contraseña">Contraseña</label>
                    <input class="form-control" type="password" id="contraseña" name="password" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="cargo">Cargo</label>
                    <input class="form-control" type="text" id="cargo" name="cargo" required>
                </div>

                <button class="btn btn-primary" type="button" id="boton">Guardar funcionario</button>
                <a class="btn btn-link" href="bienvenido_funcionario.html">Volver al panel</a>
            </form>
        </div>
    </main>

    <script src="../js/funcionario.js"></script>
</body>
</html>
