<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido funcionario</title>
    <style>
        :root {
            --azul: #2878a8;
            --azul-claro: #5dade2;
            --fondo: #eef7fc;
            --texto: #1f3b4d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 32px 20px;
            background: var(--azul-claro);
            color: white;
            text-align: center;
        }

        header img { width: 96px; margin-bottom: 12px; }
        h1 { margin: 0 0 8px; font-size: 2rem; }
        header p { margin: 0; }

        main {
            width: min(920px, calc(100% - 32px));
            margin: 42px auto;
        }

        .opciones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .opcion {
            display: flex;
            min-height: 126px;
            padding: 24px;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #d5e8f3;
            border-radius: 10px;
            background: white;
            box-shadow: 0 3px 12px rgba(31, 59, 77, .08);
            text-decoration: none;
        }

        .opcion strong { color: var(--texto); font-size: 1.08rem; }
        .opcion span { color: var(--azul); font-size: .92rem; }
        .opcion:hover { border-color: var(--azul); }

        .salir {
            display: block;
            width: fit-content;
            margin: 28px auto 0;
            color: var(--azul);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <img src="../img/Logo_Hc.jpg" alt="Logo Hospital de Clínicas">
        <h1>Bienvenido funcionario</h1>
        <p>Selecciona una opción para continuar</p>
    </header>

    <main>
        <nav class="opciones" aria-label="Opciones del sistema">
            <a class="opcion" href="funcionario.html">
                <strong>Registrar funcionario</strong>
                <span>Crear un nuevo usuario</span>
            </a>
            <a class="opcion" href="ambulancias.html">
                <strong>Módulo ambulancias</strong>
                <span>Consultar ambulancias</span>
            </a>
            <a class="opcion" href="registro_ambulancia.html">
                <strong>Registrar ambulancia</strong>
                <span>Agregar una ambulancia</span>
            </a>
            <a class="opcion" href="actualizarambulancia.html">
                <strong>Actualizar ambulancia</strong>
                <span>Modificar sus datos</span>
            </a>
            <a class="opcion" href="eliminarambulancia.html">
                <strong>Eliminar ambulancia</strong>
                <span>Retirar una ambulancia</span>
            </a>
        </nav>

        <a class="salir" href="login_funcionario.html">Cerrar sesión</a>
    </main>
</body>
</html>
