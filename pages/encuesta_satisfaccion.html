<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de satisfacción | Hospital de Clínicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5" style="max-width: 760px;">
        <div class="card p-4 p-md-5">

            <h1 class="h2" style="color:#2878a8;">Encuesta de satisfacción</h1>
            
            <p class="text-muted">Su opinión nos ayuda a mejorar la atención.</p>
            <form>
                <label class="form-label" for="atencion">¿Cómo califica la atención recibida?</label>
                <select class="form-select mb-4" id="atencion" required>
                    <option value="">Seleccione una opción</option>
                    <option>Excelente</option>
                    <option>Buena</option>
                    <option>Regular</option>
                    <option>Mala</option>
                </select>
                <label class="form-label" for="comentario">Comentarios adicionales</label>
                <textarea class="form-control mb-4" id="comentario" rows="4" placeholder="Escriba aquí su comentario"></textarea>
                <button class="btn btn-primary" type="submit">Enviar respuesta</button>
                <a class="btn btn-link" href="modulo_qr.html">Volver al portal</a>
            </form>
        </div>
    </main>
</body>
</html>
