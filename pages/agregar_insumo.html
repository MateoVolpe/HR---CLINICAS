<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar insumo | Hospital de Clínicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5" style="max-width: 680px;">
        <div class="card p-4 p-md-5">
            <h1 class="h2 mb-2" style="color:#2878a8;">Agregar insumo</h1>
            <p class="text-muted mb-4">Registre un nuevo insumo en el sistema.</p>
            <form id="formulario">
                <div class="mb-4">
                    <label class="form-label" for="descripcion">Descripción del insumo</label>
                    <input class="form-control" id="descripcion" name="descripcion" type="text" placeholder="Ej: Guantes descartables" required>
                </div>
                <button class="btn btn-primary" type="submit">Agregar insumo</button>
                <a class="btn btn-link" href="insumos.html">Volver a insumos</a>
            </form>
            <p id="respuesta" class="mt-4 mb-0" role="status" aria-live="polite"></p>
        </div>
    </main>
    <script src="../js/agregar_insumo.js"></script>
</body>
</html>
