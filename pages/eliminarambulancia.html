<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar ambulancia | Hospital de Clínicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5" style="max-width: 680px;">
        <div class="card p-4 p-md-5">
            <h1 class="h2 mb-2" style="color:#2878a8;">Eliminar ambulancia</h1>
            <p class="text-muted mb-4">Retire una ambulancia del sistema usando su matrícula.</p>

            <form id="formulario">
                <div class="mb-4">
                    <label class="form-label" for="matricula">Matrícula de la ambulancia</label>
                    <input class="form-control" type="text" id="matricula" name="matricula" placeholder="Ej: ABC123" required>
                </div>
                <button class="btn btn-danger" type="submit">Eliminar ambulancia</button>
                <a class="btn btn-link" href="bienvenido_funcionario.html">Volver al panel</a>
            </form>
            <p id="respuesta" class="mt-4 mb-0" role="status" aria-live="polite"></p>
        </div>
    </main>
    <script src="../js/eliminarambulancia.js"></script>
</body>
</html>
