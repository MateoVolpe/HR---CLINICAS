<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registrar Elemento</title>
</head>

<body>

    <h1>Registrar Elemento</h1>

    <form id="formulario">

        <label for="tipo">Tipo:</label>
        <select id="tipo" name="tipo" required>
            <option value="">Seleccionar</option>
            <option value="Paciente">Paciente</option>
            <option value="Material Biológico">Material Biológico</option>
            <option value="Equipamiento Médico">Equipamiento Médico</option>
            <option value="Insumo">Insumo</option>
        </select>

        <br><br>

        <label for="descripcion">Descripción:</label>
        <input type="text" id="descripcion" name="descripcion" required>

        <br><br>

        <button type="submit" id="boton">
            Registrar elemento
        </button>

    </form>

    <br>

    <a href="../index.html">Volver al inicio</a>

    <script src="../js/registro_elementos.js"></script>

</body>

</html>
