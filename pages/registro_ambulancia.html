<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar ambulancia | Hospital de Clínicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5" style="max-width: 680px;">
        <div class="card p-4 p-md-5">
            <h1 class="h2 mb-2" style="color:#2878a8;">Registrar ambulancia</h1>
            <p class="text-muted mb-4">Ingrese los datos de la nueva ambulancia.</p>

            <form id="formulario">
                <div class="mb-3">
                    <label class="form-label" for="matricula">Matrícula</label>
                    <input class="form-control" type="text" id="matricula" name="matricula" placeholder="Ej: ABC123" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="modelo">Modelo</label>
                    <input class="form-control" type="text" id="modelo" name="modelo" placeholder="Ej: Mercedes A01" required>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="estado">Estado</label>
                    <select class="form-select" id="estado" name="estado" required>
                        <option value="">Seleccionar</option>
                        <option value="Disponible">Disponible</option>
                        <option value="En traslado">En traslado</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit" id="boton">Registrar ambulancia</button>
                <a class="btn btn-link" href="bienvenido_funcionario.html">Volver al panel</a>
            </form>
        </div>
    </main>

    <script src="../js/registrar_ambulancia.js"></script>
</body>
</html>
