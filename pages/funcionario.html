
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Funcionarios</title>
</head>
<body>
    <h2>Registrar Funcionario</h2>
    
    <form id="formFuncionario">
        <input type="text" id="nombre" placeholder="Nombre" name="nombre" required><br><br>
        <input type="text" id="apellido" placeholder="Apellido" name="apellido" required><br><br>
        <input type="text" id="usuario" placeholder="Usuario" name="usuario" required><br><br>
        <input type="password" id="contraseña" placeholder="Contraseña" name="password" required><br><br>
        <input type="text" id="cargo" placeholder="Cargo"  name="cargo" required><br><br>
      
        <button type="button" id="boton">Guardar Funcionario</button>
    </form>

    <script src="../js/funcionario.js"></script>
</body>
</html>
